<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Maquette interactive de gestion des entretiens de parcours professionnel et du plan de développement des compétences.">
  <title>Parcours RH — Maquette interactive</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Aller au contenu</a>

  <svg class="svg-sprite" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3Z"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><path d="M7 3v3m10-3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v14H4V6a1 1 0 0 1 1-1Z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m7-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm13 10v-2a4 4 0 0 0-3-3.87m-2-11.9a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3Zm7 12 .7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10m6 10V4m6 16v-7m5 7H2"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Zm-3-10 2 2 4-5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5Zm8.5-3.5 2-1-2-3.5-2.2.5a8 8 0 0 0-1.4-.8L16.2 5h-4.1l-.7 2.2a8 8 0 0 0-1.4.8l-2.2-.5-2 3.5 2 1v1.7l-2 1 2 3.5 2.2-.5c.4.3.9.6 1.4.8l.7 2.2h4.1l.7-2.2c.5-.2 1-.5 1.4-.8l2.2.5 2-3.5-2-1V12Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9Zm-8 12h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10m-7 6h4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 2h8l4 4v16H6Zm8 0v5h5M9 12h6m-6 4h6"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6h14a2 2 0 0 1 2 2v11H4a2 2 0 0 1-2-2V6a3 3 0 0 1 3-3h12v3m0 6h5v4h-5a2 2 0 0 1 0-4Z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Navigation principale">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <span><strong>Parcours</strong><small>RH & Compétences</small></span>
      </div>
      <nav id="primary-nav"></nav>
      <div class="sidebar-note">
        <span class="note-icon"><svg><use href="#i-shield"/></svg></span>
        <div><strong>Conformité 2026</strong><small>Règles à jour au 19 sept.</small></div>
        <span class="status-dot" aria-label="À jour"></span>
      </div>
      <button class="profile-mini" type="button" data-action="profile">
        <span class="avatar avatar-sand">CM</span>
        <span><strong>Claire Martin</strong><small>Responsable RH</small></span>
        <svg><use href="#i-more"/></svg>
      </button>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <button class="icon-button menu-button" type="button" id="menu-toggle" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
        <div class="context-label" id="context-label">Pilotage RH</div>
        <div class="topbar-actions">
          <label class="role-switcher">
            <span class="sr-only">Changer de rôle de démonstration</span>
            <select id="role-select">
              <option value="rh">Vue RH</option>
              <option value="employee">Vue collaborateur</option>
            </select>
          </label>
          <button class="icon-button" type="button" data-action="search" aria-label="Rechercher"><svg><use href="#i-search"/></svg></button>
          <button class="icon-button notification-button" type="button" data-action="notifications" aria-label="Notifications, 3 non lues"><svg><use href="#i-bell"/></svg><span>3</span></button>
          <span class="avatar avatar-sand top-avatar">CM</span>
        </div>
      </header>

      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="detail-drawer" aria-labelledby="drawer-title" aria-hidden="true">
    <button class="icon-button drawer-close" type="button" data-action="close-drawer" aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
    <div id="drawer-content"></div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="app.js"></script>
</body>
</html>
